<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منبر ون - لوحة الأستاذ</title>

<style>
body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#07152d;
    color:white;
}

.container{
    width:90%;
    max-width:1000px;
    margin:auto;
    padding:40px 0;
}

header{
    text-align:center;
    padding:30px 0;
}

.logo{
    font-size:45px;
    margin-bottom:10px;
}

h1{
    margin:0;
    font-size:32px;
}

.subtitle{
    color:#9fb2cc;
    margin-top:10px;
}

.card{
    background:#0d2343;
    border:1px solid #19385f;
    border-radius:20px;
    padding:25px;
    margin-top:25px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:20px;
}

button{
    border:0;
    border-radius:15px;
    padding:22px;
    background:#12345c;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#174878;
}

.icon{
    font-size:30px;
    display:block;
    margin-bottom:8px;
}

.back{
    display:inline-block;
    margin-top:25px;
    color:white;
    text-decoration:none;
    background:#176fa8;
    padding:12px 20px;
    border-radius:12px;
}

@media(max-width:600px){
    .buttons{
        grid-template-columns:1fr;
    }

    h1{
        font-size:26px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>

<div class="logo">∑ 📐</div>

<h1>منبر ون</h1>

<div class="subtitle">
لوحة تحكم الأستاذ 👨‍🏫
</div>

</header>

<div class="card">

<h2>مرحبًا بك في لوحة الأستاذ 🎓</h2>

<p>
من هنا ستتمكن من إدارة المحتوى التعليمي لطلاب التوجيهي.
</p>

<div class="buttons">

<button>
<span class="icon">🎥</span>
إضافة حصة وفيديو
</button>

<button>
<span class="icon">📚</span>
إضافة ملخص
</button>

<button>
<span class="icon">💬</span>
إنشاء روم
</button>

<button>
<span class="icon">📝</span>
إضافة اختبار
</button>

</div>

<a class="back" href="index.html">
🏠 العودة إلى الصفحة الرئيسية
</a>

</div>

</div>

</body>
</html>
