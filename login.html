<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول | منبر ون</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    color:#f5f8ff;

    background:
    radial-gradient(circle at 15% 20%,rgba(57,169,255,.14),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(135,108,255,.14),transparent 30%),
    #071326;
}

.card{
    width:100%;
    max-width:430px;

    padding:35px;

    border-radius:28px;

    background:rgba(16,37,66,.94);

    border:1px solid rgba(255,255,255,.09);

    box-shadow:0 30px 90px rgba(0,0,0,.35);
}

.logo{
    width:68px;
    height:68px;

    margin:0 auto 18px;

    display:grid;
    place-items:center;

    border-radius:20px;

    font-size:34px;
    font-weight:bold;

    background:linear-gradient(135deg,#39a9ff,#876cff);

    box-shadow:0 0 30px rgba(57,169,255,.2);
}

h1{
    text-align:center;
    font-size:27px;
}

.subtitle{
    text-align:center;
    color:#9eb0c8;
    font-size:13px;
    margin-top:8px;
    margin-bottom:30px;
}

label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    color:#dce7f6;
}

input{
    width:100%;
    padding:14px;

    margin-bottom:17px;

    border-radius:13px;
    border:1px solid rgba(255,255,255,.1);

    outline:none;

    background:#091a31;
    color:white;

    font-size:14px;
}

input:focus{
    border-color:#39a9ff;
    box-shadow:0 0 0 3px rgba(57,169,255,.1);
}

button{
    width:100%;

    padding:14px;

    border:0;
    border-radius:13px;

    background:linear-gradient(135deg,#39a9ff,#876cff);

    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;

    margin-top:18px;
    padding:12px;

    border-radius:12px;

    text-align:center;

    font-size:12px;
}

.error{
    display:block;
    color:#ffb4c7;
    background:rgba(255,80,120,.08);
}

.success{
    display:block;
    color:#8ff0c8;
    background:rgba(53,211,154,.08);
}

.links{
    text-align:center;
    margin-top:22px;
}

.links a{
    color:#55d6ff;
    font-size:12px;
    text-decoration:none;
}

.math{
    text-align:center;
    color:rgba(255,255,255,.18);
    font-size:24px;
    margin-top:25px;
    letter-spacing:10px;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
∑
</div>

<h1>مرحبًا بك 👋</h1>

<p class="subtitle">
سجّل دخولك إلى منصة منبر ون 🎓
</p>

<form id="loginForm">

<label>البريد الإلكتروني</label>

<input
    id="email"
    type="email"
    placeholder="example@email.com"
    required
>

<label>كلمة المرور</label>

<input
    id="password"
    type="password"
    placeholder="كلمة المرور"
    minlength="6"
    required
>

<button id="loginButton" type="submit">
🚀 تسجيل الدخول
</button>

</form>

<div id="message" class="message"></div>

<div class="links">
<a href="index.html">← العودة إلى الرئيسية</a>
</div>

<div class="math">
π √ ∑ x²
</div>

</div>


<script>

/* =====================================
   بيانات Supabase
   ===================================== */

const SUPABASE_URL =
"https://vugnptbvkitokwqxulla.supabase.co";

const SUPABASE_KEY =
"ضع_هنا_PUBLISHABLE_KEY";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   تسجيل الدخول
   ===================================== */

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");

const button =
document.getElementById("loginButton");


form.addEventListener("submit", async function(event){

    event.preventDefault();

    message.className = "message";
    message.textContent = "";

    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;


    button.disabled = true;

    button.textContent =
    "⏳ جارٍ تسجيل الدخول...";


    const { data, error } =
    await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

    });


    if(error){

        message.className =
        "message error";

        message.textContent =
        "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        button.disabled = false;

        button.textContent =
        "🚀 تسجيل الدخول";

        return;
    }


    message.className =
    "message success";

    message.textContent =
    "✅ تم تسجيل الدخول بنجاح!";


    setTimeout(function(){

        window.location.href =
        "index.html";

    },1000);

});

</script>

</body>
</html>
